name: Build and Test All Distros

on:
  workflow_call:
    secrets:
      SECURITY_API_TOKEN:
        description: Tracebit API token for CI canary credentials
        required: false
    inputs:
      release_tag:
        type: string
      channel:
        type: string

env:
  # Fork pull requests and Dependabot runs do not receive the Tracebit secret.
  TRACEBIT_ENABLED: ${{ secrets.SECURITY_API_TOKEN != '' }}

jobs:
  build-binary-package:
    name: Build Redis MacOS Binary Distributions
    strategy:
      fail-fast: false
      matrix:
        os_version:         # See: https://github.com/actions/runner-images/blob/main/README.md#available-images
          - macos-15-xlarge # macOS 15 arm64
    runs-on: ${{ matrix.os_version }}
    outputs:
      redis_version: ${{ steps.set_version.outputs.redis_version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.release_tag == 'unstable' && 'unstable' || '' }}
    - name: Configure credentials
      if: env.TRACEBIT_ENABLED == 'true'
      uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
      with:
        customer-id: sha5oz2y
        api-token: ${{ secrets.SECURITY_API_TOKEN }}
        profile: administrator
        profile-region: us-east-1
        async: true
    - name: Ensure Release Branch
      if: inputs.release_tag != '' && inputs.release_tag != 'unstable'
      id: ensure-branch
      uses: redis-developer/redis-oss-release-automation/.github/actions/ensure-release-branch@main
      with:
        release_tag: ${{ inputs.release_tag }}
        allow_modify: false
        release_branch: ${{ github.ref_name }}
        gh_token: ${{ secrets.GITHUB_TOKEN }}
    - name: Determine version
      id: set_version
      run:
        echo "redis_version=$(jq -r '.ref' ./configs/redis_version.json)" >> $GITHUB_OUTPUT
    - uses: ./.github/actions/build-binary-package
      with:
        redis_version: ${{ steps.set_version.outputs.redis_version }}
        MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        MAC_NOTARIZE_USERNAME: ${{ secrets.MAC_NOTARIZE_USERNAME }}
        MAC_NOTARIZE_PASSWORD: ${{ secrets.MAC_NOTARIZE_PASSWORD }}
        MAC_NOTARIZE_TEAM_ID: ${{ secrets.MAC_NOTARIZE_TEAM_ID }}


  test:
    name: Test Redis
    needs: build-binary-package
    strategy:
      fail-fast: false
      matrix:
        os_version:         # See: https://github.com/actions/runner-images/blob/main/README.md#available-images
          - macos-26        # macOS 26 arm64
          - macos-15        # macOS 15 arm64
        cask: ${{ inputs.channel == 'stable' && fromJSON('["redis", "redis-rc"]') || fromJSON('["redis-rc"]') }}
    runs-on: ${{ matrix.os_version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.release_tag == 'unstable' && 'unstable' || '' }}
    - name: Configure credentials
      if: env.TRACEBIT_ENABLED == 'true'
      uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
      with:
        customer-id: sha5oz2y
        api-token: ${{ secrets.SECURITY_API_TOKEN }}
        profile: administrator
        profile-region: us-east-1
        async: true
    - uses: ./.github/actions/test-redis-package
      with:
        redis_version: ${{ needs.build-binary-package.outputs.redis_version }}
        cask: ${{ matrix.cask }}
        tap: ${{ vars.REDIS_TAP }}
